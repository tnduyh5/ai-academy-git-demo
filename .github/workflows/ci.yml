name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kiem-thu:
    name: Chạy bài kiểm tự động
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lấy mã nguồn về
        uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chạy test
        run: npm test
